<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
<title>Get the WEEL Driver App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#06A763;          /* WEEL green */
    --surface-1:#f6f6f4;        /* app background */
    --surface-2:#f0f0ee;        /* input fill, chip bg */
    --surface-3:#e2e2e0;        /* borders, dividers */
    --main:#ffffff;             /* card background */
    --text-primary:#000000;
    --text-secondary:#545454;
    --text-muted:#888888;
    --text-inverse:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface-1:#09090b;
      --surface-2:#161618;
      --surface-3:#26262a;
      --main:#000000;
      --text-primary:#ffffff;
      --text-secondary:#a1a1a6;
      --text-muted:#77777c;
      --text-inverse:#000000;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--surface-1);
    color:var(--text-primary);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  .card{
    max-width:420px;width:100%;
    background:var(--main);
    border:1px solid var(--surface-3);
    border-radius:20px;
    padding:36px 24px 28px;
  }
  .logo{display:block;margin:0 auto 10px;width:150px;height:auto;color:var(--text-primary)}
  .sub{
    font-family:"DM Mono",ui-monospace,monospace;
    font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--text-muted);margin:0 0 28px;
  }
  .status{min-height:22px;color:var(--text-secondary);font-size:14px;line-height:20px;margin-bottom:18px}
  .btn{
    display:block;width:100%;padding:15px 18px;margin:10px 0;border-radius:14px;
    font-size:16px;line-height:24px;font-weight:500;text-decoration:none;
    border:1px solid var(--surface-3);
    transition:transform .05s ease, filter .15s ease;
  }
  .btn:active{transform:scale(.985);opacity:.9}
  .btn--primary{background:var(--primary);color:#ffffff;border-color:transparent}
  .btn--ghost{background:var(--surface-2);color:var(--text-primary)}
  .btn small{display:block;font-weight:400;font-size:12px;line-height:16px;opacity:.75;margin-top:2px}
  .hint{color:var(--text-muted);font-size:12px;line-height:1.6;margin:22px 0 0}
  .hint b{color:var(--text-secondary);font-weight:500}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--surface-3);
    border-top-color:var(--primary);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="310 708 880 160" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WEEL"><g fill="currentColor" fill-opacity="1"><g transform="translate(310.886258, 860.249906)"><path d="M 259.0625 -151.203125 L 285.515625 -151.203125 L 232.59375 0 L 202.359375 0 L 144.390625 -124.234375 L 86.4375 0 L 56.203125 0 L 3.28125 -151.203125 L 29.734375 -151.203125 L 72.078125 -30.484375 L 128.265625 -151.203125 L 160.53125 -151.203125 L 216.71875 -30.484375 Z M 259.0625 -151.203125 "/></g><g transform="translate(594.637731, 860.249906)"><path d="M 190.515625 -128.265625 L 56.953125 -128.265625 L 56.953125 -85.171875 L 174.890625 -85.171875 L 174.890625 -62.25 L 56.953125 -62.25 L 56.953125 -22.9375 L 190.515625 -22.9375 L 190.515625 0 L 31.25 0 L 31.25 -151.203125 L 190.515625 -151.203125 Z M 190.515625 -128.265625 "/></g><g transform="translate(795.481436, 860.249906)"><path d="M 190.515625 -128.265625 L 56.953125 -128.265625 L 56.953125 -85.171875 L 174.890625 -85.171875 L 174.890625 -62.25 L 56.953125 -62.25 L 56.953125 -22.9375 L 190.515625 -22.9375 L 190.515625 0 L 31.25 0 L 31.25 -151.203125 L 190.515625 -151.203125 Z M 190.515625 -128.265625 "/></g><g transform="translate(996.325089, 860.249906)"><path d="M 56.703125 -151.203125 L 56.703125 -24.1875 L 182.703125 -24.1875 L 182.703125 0 L 31 0 L 31 -151.203125 Z M 56.703125 -151.203125 "/></g></g></svg>
    <p class="sub">Driver App</p>

    <div class="status" id="status"><span class="spin"></span>Detecting your device…</div>

    <div id="buttons" style="display:none">
      <a class="btn btn--primary" id="androidBtn" href="#">Download for Android<small>APK · install from this file</small></a>
      <a class="btn btn--ghost" id="iosBtn" href="https://testflight.apple.com/join/GPsr6Fe8">Get for iPhone<small>TestFlight</small></a>
    </div>

    <p class="hint">
      <b>Android:</b> after the download, tap the file and allow install from this source if prompted.<br>
      <b>iPhone:</b> install Apple's TestFlight app first, then open the link.
    </p>
  </div>

<script>
  // ---- Config ---------------------------------------------------------------
  var REPO = "alaaweel/WEEL-APK";
  var RELEASE_TAG = "drivers";                 // the release that holds the APK
  var IOS_URL = "https://testflight.apple.com/join/GPsr6Fe8";
  // Fallback used only if the GitHub API can't be reached:
  var APK_FALLBACK = "https://github.com/alaaweel/WEEL-APK/releases/download/drivers/build-1786348803542.apk";
  // ---------------------------------------------------------------------------

  var ua = navigator.userAgent || navigator.vendor || "";
  var isAndroid = /android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/(Mac)/i.test(ua) && "ontouchend" in document);

  var statusEl = document.getElementById("status");
  var buttonsEl = document.getElementById("buttons");
  var androidBtn = document.getElementById("androidBtn");
  var iosBtn = document.getElementById("iosBtn");
  iosBtn.href = IOS_URL;

  function showButtons(msg){
    statusEl.style.display = msg ? "block" : "none";
    if (msg) statusEl.innerHTML = msg;
    buttonsEl.style.display = "block";
  }

  // Resolve the newest .apk asset URL from the release, so the page never
  // goes stale when a new build is uploaded to the same release/tag.
  function resolveApkUrl(){
    return fetch("https://api.github.com/repos/" + REPO + "/releases/tags/" + RELEASE_TAG,
                 { headers: { "Accept": "application/vnd.github+json" } })
      .then(function(r){ if(!r.ok) throw new Error("api"); return r.json(); })
      .then(function(rel){
        var apks = (rel.assets || []).filter(function(a){ return /\.apk$/i.test(a.name); });
        if (!apks.length) throw new Error("noapk");
        // newest first
        apks.sort(function(a,b){ return new Date(b.updated_at) - new Date(a.updated_at); });
        return apks[0].browser_download_url;
      })
      .catch(function(){ return APK_FALLBACK; });
  }

  resolveApkUrl().then(function(apkUrl){
    androidBtn.href = apkUrl;

    if (isAndroid){
      statusEl.innerHTML = "Starting your download…";
      buttonsEl.style.display = "block";     // show as manual fallback too
      window.location.href = apkUrl;         // auto-start APK download
    } else if (isIOS){
      statusEl.innerHTML = "Opening TestFlight…";
      buttonsEl.style.display = "block";
      window.location.href = IOS_URL;        // auto-open TestFlight
    } else {
      showButtons("Choose your platform:");  // desktop / unknown → let them pick
    }
  });
</script>
</body>
</html>
